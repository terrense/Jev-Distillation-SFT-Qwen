name: Offline preparation checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-prep.txt
      - name: Install CPU preparation dependencies
        run: python -m pip install -r requirements-prep.txt
      - name: Verify handoff materials
        run: python scripts/verify_handoff.py
      - name: Test root pipeline
        run: python -m unittest -v test_pipeline.py
      - name: Test research preparation
        working-directory: 实验准备
        run: python -m unittest -v test_preparation.py
      - name: Validate pending candidates
        working-directory: 实验准备
        run: python prepare.py validate --input data/candidates.canonical.jsonl --output ../reports/ci_data_validation.json
