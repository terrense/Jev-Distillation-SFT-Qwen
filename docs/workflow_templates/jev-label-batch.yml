name: Jev labeling (manual budget)
on:
  workflow_dispatch:
    inputs:
      input_package:
        description: Synthetic candidate package only
        type: choice
        options:
          - seed_candidates
          - context_pairs
        default: seed_candidates
      max_requests:
        description: Maximum paid API requests in this run
        type: choice
        options: ['1', '5', '10', '25']
        default: '5'
permissions:
  contents: read
concurrency:
  group: jev-paid-labeling
  cancel-in-progress: false
jobs:
  label:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Run a bounded synthetic labeling batch
        shell: pwsh
        env:
          JEVSTATION_API_KEY: ${{ secrets.JEVSTATION_API_KEY }}
          INPUT_PACKAGE: ${{ inputs.input_package }}
          REQUEST_CAP: ${{ inputs.max_requests }}
        run: |
          if (-not $env:JEVSTATION_API_KEY) { throw 'Repository Secret JEVSTATION_API_KEY is not configured.' }
          $allowedCaps = @(1, 5, 10, 25)
          $cap = [int]$env:REQUEST_CAP
          if ($cap -notin $allowedCaps) { throw 'Invalid request budget.' }
          $packages = @{
            seed_candidates = 'data/seed_candidates.jsonl'
            context_pairs = 'data/context_pairs_v0.2.jsonl'
          }
          if (-not $packages.ContainsKey($env:INPUT_PACKAGE)) { throw 'Invalid synthetic package.' }
          $inputPath = $packages[$env:INPUT_PACKAGE]
          $out = "reports/workflow_jev_${{ github.run_id }}.jsonl"
          python intent_lab.py predict --provider jev --model jev --transport powershell --api-key-env JEVSTATION_API_KEY --input $inputPath --output $out --max-requests $cap --workers 1 --timeout 45
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_jev_batch.py --input $out
      - name: Downloadable raw labels and metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jev-annotations-${{ github.run_id }}
          path: reports/workflow_jev_${{ github.run_id }}.jsonl*
          if-no-files-found: ignore
          retention-days: 30
