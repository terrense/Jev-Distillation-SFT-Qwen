# 意图识别框架 - 全局参数配置
#
# 此文件只管全局参数和模块开关，各模块的 intent 定义跟着模块代码走（通过注册接口注入）。
# 部署时可根据医院需求修改此文件（如禁用某个意图模块）。

# 当意图无法识别（idle）时的追问文案（历史键名 unknown_response 仍兼容读取）
idle_response: "抱歉，没太听明白您的需求。请问您是身体不舒服想看病，还是想查询地点或就医流程？"

# 最大追问轮数（超过后不再追问，返回兜底提示）
max_clarification_rounds: 2

# 禁用的意图列表（填写意图 name，如 ["inquiry"]）
# 未列出的模块默认启用
disabled_intents: []
